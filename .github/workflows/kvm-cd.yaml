# This is a basic workflow to help you get started with Actions

name: prod-deploy-kvm

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  prepare-kvm:
    runs-on: self-hosted
    steps:
      - name: test integrate
        timeout-minutes: 1
        run: |
            pwd
            cd /home/satria16alan/Dokumen/kvm
            ls
            pwd

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: install image for kvm
        run: 
            chmod +x requirement.sh
            ./requirement.sh

      - name: Cache Image
        uses: actions/cache@v5
        with:
          path: ./image
          key: ${{ runner.os }}-${{ hashFiles('requirement.sh')}}
          restore-keys: kvm-image-${{ runner.os}}-

      - name: setup kvm
        run: |
            chmod +x all-create-set.sh
            ./all-create-set.sh

     # - name: Create kvm
     #   run: |
    #      ./create-kvm.sh
  setup-inside-kvm:
    runs-on: self-hosted
    needs: prepare-kvm
    steps:
       - name: Checkout repo
         uses: actions/checkout@v7
        
       - name: setup networking
         run: |
             chmod +x setup-network.sh
             ./setup-network.sh
      
  setup-monitoring-kvm:
      runs-on: self-hosted
      needs: setup-inside-kvm
      steps:
        - name: Checkout repo
          uses: actions/checkout@v7

        - name: setup prometheus
          run: | 
              chmod +x setup-prome.sh
              ./setup-prome.s
              
